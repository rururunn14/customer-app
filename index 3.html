<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffafc">
<title>顧客管理</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#393039;background:#fffafc;--pink:#d581a3;--soft:#f9ebf1;--line:#eadfe5}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}main{max-width:560px;margin:0 auto;padding:14px 14px calc(105px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:center;min-height:58px;position:relative}h1{font-size:21px;margin:0}h2{font-size:17px;margin:0 0 12px}.muted{color:#827780;font-size:13px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;margin:14px 0;box-shadow:0 1px 7px #00000006}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.row button{flex-shrink:0}.btn{border:0;background:var(--pink);color:white;padding:12px 16px;border-radius:11px;font-weight:600}.btn.secondary{background:var(--soft);color:#82596a}.btn.danger{background:#f8e6e8;color:#9a344d}.btn:disabled{opacity:.45}.wide{width:100%;margin-top:12px}input,textarea,select{width:100%;background:white;border:1px solid #d8ccd3;border-radius:9px;padding:12px;margin:7px 0 14px;color:#352d33}textarea{min-height:120px;resize:vertical}label{font-weight:600;font-size:14px;display:block}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;padding:8px 0;color:#817780;font-size:12px}.day{border:0;background:#f9f3f6;min-height:45px;border-radius:7px;position:relative;color:#3b343a}.day.selected{background:var(--pink);color:white}.day.has-visit:after{content:"•";position:absolute;bottom:0;left:47%;font-size:19px}.entry{padding:13px 2px;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0}.name{font-size:16px;font-weight:600}.details{font-size:13px;color:#827780;margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}.entry-actions{display:flex;gap:8px;margin-top:9px}.tiny{font-size:13px;padding:7px 10px}.tabbar{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:10}.tabbar button{border:0;border-radius:11px;background:white;color:#8a8188;font-size:14px;padding:10px;max-width:190px;flex:1}.tabbar button[aria-selected="true"]{background:var(--soft);color:#ae577e;font-weight:700}.tabbar svg{display:block;margin:0 auto 4px;width:21px;height:21px}.page[hidden],#customerFormView[hidden],#customerListView[hidden]{display:none}.notice{background:#fff0f4;border-radius:8px;padding:12px;color:#85354f}.blank{min-height:45px}#status{color:#a32d49;font-size:13px;white-space:pre-wrap}.form-header{display:flex;align-items:center;justify-content:space-between;padding:2px 0 12px;border-bottom:1px solid var(--line)}.text-button{background:transparent;border:0;padding:10px 4px;color:var(--pink);font-weight:600}.text-button.close{font-size:26px;color:#453b41}.form-title{font-size:20px;font-weight:700}.form-field{padding:15px 0;border-bottom:1px solid var(--line)}.form-field:last-child{border-bottom:0}.help{font-size:12px;color:#817780}.card-title{margin-top:14px}a{color:#8d5871}
</style>
</head>
<body>
<main>
<p id="status" role="alert"></p><noscript><p class="notice">このプレビューでは操作できません。GitHub Pagesで公開したページをSafariから開いてください。</p></noscript>
<section class="page" id="calendarPage">
<header><h1>カレンダー</h1></header>
<section class="panel">
<div class="row"><button class="btn secondary" id="prev" aria-label="前の月">‹</button><strong id="month">2026年11月</strong><button class="btn secondary" id="next" aria-label="次の月">›</button></div>
<div id="calendar" class="calendar" aria-label="来店カレンダー"><div class="weekday">日</div><div class="weekday">月</div><div class="weekday">火</div><div class="weekday">水</div><div class="weekday">木</div><div class="weekday">金</div><div class="weekday">土</div><button class="day" type="button" data-fallback="true">1</button><button class="day" type="button" data-fallback="true">2</button><button class="day" type="button" data-fallback="true">3</button><button class="day" type="button" data-fallback="true">4</button><button class="day" type="button" data-fallback="true">5</button><button class="day" type="button" data-fallback="true">6</button><button class="day" type="button" data-fallback="true">7</button><button class="day" type="button" data-fallback="true">8</button><button class="day" type="button" data-fallback="true">9</button><button class="day selected" type="button" data-fallback="true">10</button><button class="day" type="button" data-fallback="true">11</button><button class="day" type="button" data-fallback="true">12</button><button class="day" type="button" data-fallback="true">13</button><button class="day" type="button" data-fallback="true">14</button><button class="day" type="button" data-fallback="true">15</button><button class="day" type="button" data-fallback="true">16</button><button class="day" type="button" data-fallback="true">17</button><button class="day" type="button" data-fallback="true">18</button><button class="day" type="button" data-fallback="true">19</button><button class="day" type="button" data-fallback="true">20</button><button class="day" type="button" data-fallback="true">21</button><button class="day" type="button" data-fallback="true">22</button><button class="day" type="button" data-fallback="true">23</button><button class="day" type="button" data-fallback="true">24</button><button class="day" type="button" data-fallback="true">25</button><button class="day" type="button" data-fallback="true">26</button><button class="day" type="button" data-fallback="true">27</button><button class="day" type="button" data-fallback="true">28</button><button class="day" type="button" data-fallback="true">29</button><button class="day" type="button" data-fallback="true">30</button><div class="blank" aria-hidden="true"></div><div class="blank" aria-hidden="true"></div><div class="blank" aria-hidden="true"></div><div class="blank" aria-hidden="true"></div><div class="blank" aria-hidden="true"></div></div>
<p id="selected" class="muted">選択中：2026-11-10</p>
<label for="visitCustomer">来店したお客さん</label><select id="visitCustomer"></select>
<button class="btn wide" id="addVisit">この日に来店を記録</button>
<div id="dailyVisits"></div>
</section>
</section>
<section class="page" id="customersPage" hidden>
<div id="customerListView">
<header><h1>顧客一覧</h1></header>
<section class="panel">
<div id="customers"></div>
<button class="btn wide" id="openCustomerForm" type="button">＋ 顧客を追加する</button>
</section>
</div>
<div id="customerFormView" hidden>
<div class="form-header"><button class="text-button close" type="button" id="cancelCustomer" aria-label="顧客一覧へ戻る">×</button><span class="form-title">顧客</span><button class="text-button" type="button" id="saveCustomer">保存</button></div><p class="muted">名前・誕生日・お酒・メモを入力して保存できます。</p>
<form id="customerForm" autocomplete="off">
<div class="form-field"><label for="customerName">名前</label><input id="customerName" maxlength="80" required placeholder="名前を入力"></div>
<div class="form-field"><label for="customerBirthday">誕生日</label><input id="customerBirthday" type="date"></div>
<div class="form-field"><label for="customerAlcohol">お酒</label><input id="customerAlcohol" maxlength="300" placeholder="好きなお酒・よく飲むお酒"></div>
<div class="form-field"><label for="customerMemo">メモ</label><textarea id="customerMemo" maxlength="5000" placeholder="自由に入力"></textarea></div>
</form>
<button class="btn secondary wide" type="button" id="goCustomerList">顧客一覧を見る</button>
</div>
</section>
<section class="page" id="settingsPage" hidden>
<header><h1>設定</h1></header>
<section class="panel"><h2>バックアップ</h2>
<p class="muted">定期的にバックアップを保存してください。書き出すファイルは暗号化されていません。</p>
<button class="btn secondary wide" id="export">バックアップを書き出す</button>
<label for="import" class="card-title">バックアップを読み込む</label>
<input type="file" id="import" accept="application/json,.json">
<p class="muted">読み込むと現在のデータがバックアップの内容に置き換わります。</p>
</section>
</section>
</main>
<nav class="tabbar" aria-label="画面切り替え">
<button data-tab="calendarPage" aria-selected="true" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>カレンダー</button>
<button data-tab="customersPage" aria-selected="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>顧客</button>
<button data-tab="settingsPage" aria-selected="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.2 2.2m8.4 8.4 2.2 2.2m0-12.8-2.2 2.2M7.8 16.2l-2.2 2.2"/><circle cx="12" cy="12" r="4"/></svg>設定</button>
</nav>
<script>
'use strict';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=new Date();let year=today.getFullYear(),month=today.getMonth(),selected=dateKey(today);
let db,customers=[],visits=[];
function report(msg){$('status').textContent=msg;}
// 旧版と同じデータベース名とストア名を使用。既存データは消さない。
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('customer-calendar-v1',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('customers'))d.createObjectStore('customers',{keyPath:'id'});if(!d.objectStoreNames.contains('visits'))d.createObjectStore('visits',{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function all(store){return new Promise((resolve,reject)=>{const req=db.transaction(store,'readonly').objectStore(store).getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function put(store,item){return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(item);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}
function del(store,id){return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}
function replaceStores(data){return new Promise((resolve,reject)=>{const tx=db.transaction(['customers','visits'],'readwrite');const c=tx.objectStore('customers'),v=tx.objectStore('visits');c.clear();v.clear();for(const item of data.customers)c.put(item);for(const item of data.visits)v.put(item);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});}
async function refresh(){customers=await all('customers');visits=await all('visits');render();}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function showTab(id){for(const page of document.querySelectorAll('.page'))page.hidden=page.id!==id;for(const b of document.querySelectorAll('[data-tab]'))b.setAttribute('aria-selected',String(b.dataset.tab===id));if(id==='customersPage')showCustomerForm();window.scrollTo(0,0);}
function showCustomerList(){$('customerListView').hidden=false;$('customerFormView').hidden=true;}
function showCustomerForm(){$('customerForm').reset();$('customerListView').hidden=true;$('customerFormView').hidden=false;window.scrollTo(0,0);}
function render(){
 $('month').textContent=`${year}年${month+1}月`;$('selected').textContent=`選択中：${selected}`;
 const grid=$('calendar');grid.replaceChildren();['日','月','火','水','木','金','土'].forEach(w=>grid.append(node('div',w,'weekday')));
 const offset=new Date(year,month,1).getDay(),last=new Date(year,month+1,0).getDate();
 for(let i=0;i<offset;i++)grid.append(node('div'));
 for(let day=1;day<=last;day++){const key=`${year}-${pad(month+1)}-${pad(day)}`;const b=node('button',String(day),'day'+(key===selected?' selected':'')+(visits.some(v=>v.date===key)?' has-visit':''));b.type='button';b.onclick=()=>{selected=key;render();};grid.append(b);}
 const select=$('visitCustomer');const prior=select.value;select.replaceChildren();customers.forEach(c=>{const o=node('option',c.name);o.value=c.id;select.append(o);});if(customers.some(c=>c.id===prior))select.value=prior;
 $('addVisit').disabled=!customers.length;
 const daily=$('dailyVisits');daily.replaceChildren();const records=visits.filter(v=>v.date===selected);
 if(records.length)daily.append(node('h2','この日の来店','card-title'));
 records.forEach(v=>{const row=node('div',undefined,'row entry');row.append(node('span',customers.find(c=>c.id===v.customerId)?.name||'削除済みの顧客'));const b=node('button','取消','btn danger tiny');b.onclick=async()=>{if(!confirm('この来店記録を取り消しますか？'))return;try{await del('visits',v.id);await refresh();}catch(err){report('取消エラー：'+err.message);}};row.append(b);daily.append(row);});
 const list=$('customers');list.replaceChildren();if(!customers.length)list.append(node('p','顧客はまだ登録されていません。','muted'));
 [...customers].sort((a,b)=>a.name.localeCompare(b.name,'ja')).forEach(c=>{const related=visits.filter(v=>v.customerId===c.id).sort((a,b)=>b.date.localeCompare(a.date));const box=node('div',undefined,'entry');box.append(node('div',c.name,'name'));box.append(node('div',`${related.length}回来店${related.length?' / 最終：'+related[0].date:''}`,'muted'));if(c.birthday)box.append(node('div',`誕生日：${c.birthday}`,'details'));if(c.alcohol)box.append(node('div',`お酒：${c.alcohol}`,'details'));if(c.memo)box.append(node('div',`メモ：${c.memo}`,'details'));const actions=node('div',undefined,'entry-actions');const b=node('button','削除','btn danger tiny');b.onclick=async()=>{if(!confirm(`${c.name}さんと来店履歴を削除しますか？`))return;try{for(const v of related)await del('visits',v.id);await del('customers',c.id);await refresh();}catch(err){report('削除エラー：'+err.message);}};actions.append(b);box.append(actions);list.append(box);});
}
for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>showTab(b.dataset.tab);
$('prev').onclick=()=>{const d=new Date(year,month-1,1);year=d.getFullYear();month=d.getMonth();render();};
$('next').onclick=()=>{const d=new Date(year,month+1,1);year=d.getFullYear();month=d.getMonth();render();};
$('openCustomerForm').onclick=showCustomerForm;
$('cancelCustomer').onclick=showCustomerList;
$('goCustomerList').onclick=showCustomerList;
$('customerForm').onsubmit=e=>{e.preventDefault();saveCustomer();};
$('saveCustomer').onclick=saveCustomer;
async function saveCustomer(){const name=$('customerName').value.trim();if(!name){alert('名前を入力してください');$('customerName').focus();return;}if(customers.some(c=>c.name===name)){alert('同じ名前が登録されています');return;}
 try{await put('customers',{id:crypto.randomUUID(),name,birthday:$('customerBirthday').value,alcohol:$('customerAlcohol').value.trim(),memo:$('customerMemo').value.trim()});await refresh();showCustomerList();}catch(err){report('保存エラー：'+err.message);}}
$('addVisit').onclick=async()=>{const customerId=$('visitCustomer').value;if(!customerId)return;if(visits.some(v=>v.customerId===customerId&&v.date===selected))return alert('この日の来店は記録済みです');try{await put('visits',{id:crypto.randomUUID(),customerId,date:selected});await refresh();}catch(err){report('来店記録エラー：'+err.message);}};
$('export').onclick=()=>{const content=JSON.stringify({version:1,customers,visits},null,2);const blob=new Blob([content],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`customer-backup-${dateKey(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);};
$('import').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.customers)||!Array.isArray(data.visits)||!data.customers.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&(c.birthday===undefined||typeof c.birthday==='string')&&(c.alcohol===undefined||typeof c.alcohol==='string')&&(c.memo===undefined||typeof c.memo==='string'))||!data.visits.every(v=>typeof v.id==='string'&&typeof v.customerId==='string'&&typeof v.date==='string'))throw Error('ファイルの形式が違います');if(!confirm('現在のデータをバックアップの内容で置き換えますか？'))return;await replaceStores(data);await refresh();alert('読み込みが完了しました');}catch(err){report('読み込みエラー：'+err.message);}finally{e.target.value='';}};
// カレンダーは保存領域の読み込みを待たずに描画する。HTMLにも初期日付を入れている。
render();
(async()=>{try{if(!('indexedDB'in window))throw Error('このブラウザはIndexedDBに対応していません');db=await openDB();await refresh();}catch(e){report('保存領域を利用できません：'+e.message);$('saveCustomer').disabled=true;$('addVisit').disabled=true;$('export').disabled=true;report('データ保存はこの画面では利用できません。Safariで公開されたWebアプリを開いてください。詳細：'+e.message);}})();
</script>
</body>
</html>
